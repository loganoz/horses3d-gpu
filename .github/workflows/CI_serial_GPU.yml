name: CI SERIAL GPU

########################################################################
on:
  # Manual trigger only
  workflow_dispatch:

jobs:
  serial-gpu-tests:
    # Uses self-hosted runner on Cesvima cluster with GPU access
    name: Serial GPU Tests (NVFORTRAN)
    runs-on: [self-hosted, cesvima, gpu]
    # Prevent runaway jobs from consuming cluster resources indefinitely
    timeout-minutes: 120
    
    env:
      METIS_HOME: ${{ github.workspace }}/metis-5.1.0/build/Linux-x86_64
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure Horses3D
        run: |
          module purge
          module load NVHPC/23.7-CUDA-12.2.0
          cd Solver
          ./configure

      - name: Compile horses3d
        working-directory: ./Solver
        run: |
          module purge
          module load NVHPC/23.7-CUDA-12.2.0
          make allclean COMPILER=nvfortran COMM=SERIAL ENABLE_THREADS=NO
          make ns ins mu COMPILER=nvfortran COMM=SERIAL ENABLE_THREADS=NO

########################################################################
#######                    NAVIER-STOKES TESTS                  ########
########################################################################

#
# 1) CYLINDER
# -----------

      - name: Build NSCylinder
        working-directory: ./Solver/test/NavierStokes/Cylinder/SETUP
        run: |
          module purge
          module load NVHPC/23.7-CUDA-12.2.0
          make clean || true
          make ns COMPILER=nvfortran COMM=SERIAL ENABLE_THREADS=NO
        if: '!cancelled()'

      - name: Run NSCylinder
        working-directory: ./Solver/test/NavierStokes/Cylinder
        run: |
          module purge
          module load NVHPC/23.7-CUDA-12.2.0
          
          cat > run_test.sh << 'EOF'
          #!/bin/bash
          #SBATCH --job-name=NSCylinder_Serial
          #SBATCH --ntasks=1
          #SBATCH --mem=20G
          #SBATCH --partition=standard-gpu
          #SBATCH --gres=gpu
          #SBATCH --time=00:15:00
          
          module purge
          module load NVHPC/23.7-CUDA-12.2.0
          ./horses3d.ns Cylinder.control
          EOF
          
          job_id=$(sbatch --parsable run_test.sh)
          while squeue -j $job_id 2>/dev/null | grep -q $job_id; do sleep 10; done
          
          cat slurm-${job_id}.out
          
          # Check exit code (ExitCode:Signal, e.g., "0:0" means success)
          exit_code=$(sacct -j $job_id --format=ExitCode --noheader | head -1 | tr -d ' ' | cut -d':' -f1)
          if [ "$exit_code" != "0" ]; then
            echo "Test failed with exit code: $exit_code"
            exit 1
          fi
        if: '!cancelled()'

